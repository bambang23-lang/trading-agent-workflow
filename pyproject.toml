[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agent-workflow"
version = "0.1.0"
description = "Trading agent workflow with backtesting, risk controls, and dashboard monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  "ccxt>=4.0.0",
  "alpaca-py>=0.38.0",
  "python-dotenv>=1.0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
